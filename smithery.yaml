startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - PANEL_URL
      - PANEL_TOKEN
    properties:
      PANEL_URL:
        type: string
        title: Pterodactyl Panel URL
        description: "Base URL of your Pterodactyl panel (no trailing slash). Example: https://panel.example.com"
      PANEL_TOKEN:
        type: string
        title: Application API Key
        description: "Pterodactyl Application API key (admin). Usually starts with 'ptla_'."
      PANEL_TIMEOUT:
        type: number
        title: Request Timeout (seconds)
        description: "HTTP request timeout in seconds."
        default: 30
      PANEL_VERIFY_SSL:
        type: boolean
        title: Verify SSL
        description: "Whether to verify the panel's TLS certificate."
        default: true
      PANEL_USER_AGENT:
        type: string
        title: User Agent
        description: "Custom User-Agent header sent with requests."
        default: "PterodactylMCP/0.1"
  commandFunction: |
    (config) => ({
      command: "pterodactyl-mcp",
      args: ["--transport", "stdio", "--no-banner"],
      env: {
        PANEL_URL: config.PANEL_URL,
        PANEL_TOKEN: config.PANEL_TOKEN,
        PANEL_TIMEOUT: String(config.PANEL_TIMEOUT ?? 30),
        PANEL_VERIFY_SSL: String(config.PANEL_VERIFY_SSL ?? true),
        PANEL_USER_AGENT: config.PANEL_USER_AGENT ?? "PterodactylMCP/0.1"
      }
    })
